services:
  - type: web
    name: fact-knowledge-layer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        value: sqlite:////data/factlayer.db
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: factlayer-data
      mountPath: /data
      sizeGB: 1
